<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>{{TITULO}} — TV</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f1f5f9;font:22px/1.3 system-ui,Segoe UI,Arial;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;font-size:32px;font-weight:700}
.sub{color:#94a3b8;font-size:20px;font-weight:400}.relogio{font-size:48px;font-weight:800;color:#86efac}
#corpo{padding:0 32px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px}
.bloco{background:#1e293b;border-radius:14px;padding:22px}.vazio{margin:12vh 32px;text-align:center;color:#64748b;font-size:34px}
</style></head><body>
<header><div>{{TITULO}}<div class="sub">Painel de TV · {{PUBLICO}}</div></div><div class="relogio" id="rel">--:--</div></header>
<div id="corpo"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function carregar(){
 try{const d=await (await fetch('/tv/{{AREA}}/dados')).json();
  document.getElementById('corpo').innerHTML=d.blocos.length
   ?d.blocos.map(b=>'<div class="bloco"><div class="sub">'+esc(b.titulo)+'</div><div style="font-size:56px;font-weight:800">'+esc(b.valor)+'</div></div>').join('')
   :'<div class="vazio" style="grid-column:1/-1">Painel em desenvolvimento</div>'}catch(e){}}
carregar();setInterval(carregar,30000);
setInterval(()=>{document.getElementById('rel').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},1000);
</script></body></html>
