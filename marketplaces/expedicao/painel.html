<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Expedição — painel do dia</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:18px/1.25 system-ui,Segoe UI,Arial}
.topo{display:flex;align-items:center;gap:24px;padding:12px 28px;background:#1e293b;flex-wrap:wrap}
.topo h1{margin:0;font-size:30px;flex:1}.relogio{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.sim{background:#b45309;color:#fff;padding:4px 14px;border-radius:14px;font-weight:800;letter-spacing:1px}
.ctl{display:flex;gap:12px;align-items:center;padding:8px 28px;background:#111827;color:#cbd5e1;font-size:15px;flex-wrap:wrap}
.ctl input[type=range]{width:380px}.ctl button,.ctl select,.ctl input[type=date]{font:inherit;padding:5px 12px;border-radius:6px;border:0;background:#334155;color:#f8fafc;cursor:pointer}
.alertas{padding:10px 28px 0}.al{padding:7px 16px;border-radius:8px;margin-bottom:6px;font-size:20px;font-weight:600}
.al.critico{background:#7f1d1d;color:#fecaca}.al.atencao{background:#78350f;color:#fde68a}
.semchk{padding:6px 28px 0}.semchk h3{margin:4px 0 6px;font-size:18px;letter-spacing:1px;color:#94a3b8;font-weight:600}
.semchk .ped{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 14px;margin-bottom:4px;border-radius:8px;background:#1e293b;font-size:19px;color:#e2e8f0}.semchk .ped.atr{border-left:6px solid #ef4444}.semchk .ped span{color:#94a3b8}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:14px 28px}
@media (min-width:1100px){.mods{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1500px){.mods{grid-template-columns:repeat(4,1fr)}}
.mod{background:#1e293b;border-radius:14px;padding:16px 20px 14px;border-top:7px solid #475569;display:flex;flex-direction:column;gap:6px}
.mod.flex{border-color:#22c55e}.mod.coleta{border-color:#3b82f6}.mod.places{border-color:#f59e0b}.mod.dba{border-color:#a855f7}.mod.shopee{border-color:#f97316}
.mod h2{margin:0;font-size:26px;display:flex;justify-content:space-between;align-items:baseline}
.mod h2 small{font-size:16px;color:#94a3b8;font-weight:600}
.rot{font-size:14px;letter-spacing:1.5px;color:#94a3b8;margin-top:2px}
.hora{font-size:76px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.cd{font-size:50px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.cd.ok{color:#86efac}.cd.alerta{color:#fcd34d}.cd.critico{color:#fb923c}.cd.atraso{color:#fca5a5}
.pronto{font-size:34px;font-weight:800;color:#86efac;margin:6px 0}.semped{font-size:26px;font-weight:700;color:#64748b;margin:14px 0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.nums div{background:#0f172a;border-radius:10px;padding:6px 8px;text-align:center}.nums b{display:block;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;letter-spacing:1px;color:#94a3b8}.nums .pend b{color:#fcd34d}.nums .pend.zero b{color:#86efac}.nums .ok b{color:#86efac}
.barra{height:12px;background:#334155;border-radius:6px;overflow:hidden}.barra>div{height:100%;background:#22c55e;transition:width .6s}
.outros{font-size:16px;color:#cbd5e1;border-top:1px solid #334155;padding-top:6px;margin-top:2px}.outros div{display:flex;justify-content:space-between;gap:10px}
.outros b{font-variant-numeric:tabular-nums}.nota{font-size:14px;color:#64748b;margin-top:2px}
.full{margin:6px 28px 28px}.full h2{font-size:26px;margin:10px 0 8px}
.env{background:#1e293b;border-radius:14px;padding:14px 20px;margin-bottom:10px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;align-items:center}
.env .tt{font-size:24px;font-weight:800}.env .sub{color:#94a3b8;font-size:16px}
.meta{font-size:28px;font-weight:800}.meta.ok{color:#86efac}.meta.alerta{color:#fcd34d}.meta.atraso{color:#fca5a5}
.chip{display:inline-block;min-width:54px;text-align:center;padding:5px 10px;margin-right:6px;border-radius:8px;background:#334155;color:#94a3b8;font-weight:800}
.chip.on{background:#16a34a;color:#fff}
.canal{display:inline-block;padding:1px 12px;border-radius:12px;font-size:18px;margin-right:8px;background:#64748b}
.canal.meli{background:#b45309}.canal.amazon{background:#1d4ed8}.canal.shopee{background:#c2410c}
.vazio{color:#64748b;font-size:24px;padding:12px 28px}.barra.f{margin:8px 0}
</style></head><body>
<div class="topo"><a id="voltar" href="/expedicao" style="color:#94a3b8;font-size:16px;text-decoration:none;margin-right:14px">← Expedição</a><h1 id="titulo">Expedição</h1><span id="simtag"></span><span class="relogio" id="relogio">--:--:--</span></div>
<div class="ctl" id="ctl">
 <label>Modo <select id="modo"><option value="real">Real (hoje)</option><option value="sim">Simulação (amanhã)</option></select></label>
 <label>Dia <input type="date" id="dia"></label>
 <span id="boxhora"><label>Hora <input type="range" id="hora" min="300" max="1200" step="5" value="300"> <b id="horatxt">05:00</b></label>
 <button id="play">▶ Reproduzir o dia</button></span>
 <span style="opacity:.7">Para a TV, abra com <code>?tv=1</code>. Simulação usa dados fictícios.</span>
</div>
<div class="alertas" id="alertas"></div>
<div class="semchk" id="semchk"></div>
<div class="mods" id="mods"></div>
<div class="full"><h2 id="fulltit">Montagem do Full no dia</h2><div id="full"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);const TV=P.get('tv')==='1';
if(TV){$('ctl').style.display='none';$('voltar').style.display='none'}
const amanha=new Date();amanha.setDate(amanha.getDate()+1);   // data local do navegador, não UTC
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const REAL0=TV||P.get('real')==='1';const DIA_FIXO=P.get('dia');
const hojeIso=()=>iso(new Date());
$('dia').value=DIA_FIXO||(REAL0?hojeIso():iso(amanha));$('modo').value=REAL0?'real':'sim';
const NOMES={meli:'Mercado Livre',amazon:'Amazon',shopee:'Shopee'};
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function fmtMin(m){if(m==null)return '—';const a=Math.abs(m),h=Math.floor(a/60);return (m<0?'−':'')+(h?h+'h ':'')+String(a%60).padStart(2,'0')+'min'}
// ── relógio e contagem regressiva (rodam a cada segundo, sem buscar dados de novo) ──
let DESVIO=0,SIM_FIXO=null;                       // DESVIO = hora do servidor − hora deste navegador; na simulação o "agora" fica parado
const agoraMs=()=>SIM_FIXO!==null?SIM_FIXO:Date.now()+DESVIO;
const dois=n=>String(n).padStart(2,'0');
function fmtCd(ms){const neg=ms<0,s=Math.floor(Math.abs(ms)/1000);return (neg?'−':'')+dois(Math.floor(s/3600))+':'+dois(Math.floor(s%3600/60))+':'+dois(s%60)}
function classeCd(ms){return ms<0?'atraso':(ms<=900000?'critico':(ms<=3600000?'alerta':'ok'))}
function tick(){
 const a=agoraMs();
 $('relogio').textContent=new Date(a).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit'});
 document.querySelectorAll('[data-iso]').forEach(e=>{const ms=Date.parse(e.dataset.iso)-a;
  e.textContent=ms<0?'ATRASADO '+fmtCd(-ms):fmtCd(ms);if(e.classList.contains('cd'))e.className='cd '+classeCd(ms)})}
setInterval(tick,1000);
// ── cartões por módulo ──
function tipo(id){return id.startsWith('places')?'places':(id.startsWith('shopee')?'shopee':id)}
function cartao(m){
 const marcos=m.marcos||[],p=m.principal!=null?marcos[m.principal]:null;
 let h='<div class="mod '+tipo(m.id)+'"><h2><span>'+esc(m.nome)+'</span><small>'+(m.sem_dados?'sem pedidos da Shopee':(m.pedidos?m.unidades+' un.':''))+'</small></h2>';
 const concluido=!m.sem_dados&&m.pedidos>0&&m.pendentes===0;
 if(!m.sem_dados&&!m.pedidos){h+='<div class="semped">sem pedidos hoje</div>'}
 else if(p){
  h+='<div class="rot">'+esc(p.rotulo==='Corte'?'ENTREGAR ATÉ':p.rotulo.toUpperCase())+'</div><div class="hora">'+esc(p.hhmm)+'</div>';
  h+=concluido?'<div class="pronto">✔ TUDO PRONTO</div>':(m.sem_dados&&p.pendentes===0?'<div class="pronto">✔ CORTE ENCERRADO · 0 pendentes</div>':'<div class="cd ok" data-iso="'+esc(p.iso)+'">--:--:--</div>');
 }
 if(m.sem_dados){h+='<div class="nota">A contagem de pedidos da Shopee entra quando a loja estiver conectada.</div>'}
 else if(m.pedidos){
  h+='<div class="nums"><div><b>'+m.pedidos+'</b><span>SAEM</span></div><div class="ok"><b>'+m.prontos+'</b><span>PRONTOS</span></div>'+
     '<div class="pend'+(m.pendentes?'':' zero')+'"><b>'+m.pendentes+'</b><span>PENDENTES</span></div></div>'+
     '<div class="barra"><div style="width:'+m.percentual+'%"></div></div>';
  if(m.no_ponto!=null)h+='<div class="nota">No ponto de coleta: <b>'+m.no_ponto+' / '+m.pedidos+'</b></div>';
 }
 // outros horários do mesmo módulo: só os que ainda têm pendência (o DBA mostra as duas etapas, etiqueta e ponto)
 const lista=marcos.filter(x=>x.pendentes!==0||m.id==='dba');
 if(lista.length>1)h+='<div class="outros">'+lista.map(x=>'<div'+(x===p?' style="color:#f8fafc;font-weight:700"':'')+'><span>'+esc(x.rotulo)+' · <b>'+esc(x.hhmm)+'</b>'+(x.pendentes!=null?' · '+x.pendentes+' pend.':'')+'</span>'+
   (x.pendentes===0?'<b style="color:#86efac">✔ feito</b>':'<b data-iso="'+esc(x.iso)+'">--</b>')+'</div>').join('')+'</div>';
 return h+'</div>';
}
// pedidos sem checkout: de manhã são muitos, então a tela mostra os de meta mais antiga e diz quantos faltam
const MAX_SEM_CHECKOUT=12;
function semCheckout(ls){
 if(!ls.length)return '';
 const venda=x=>x.bling_numero?'Bling '+esc(x.bling_numero):'sem pedido no Bling · '+esc(x.pacote||x.pedido);
 const skus=x=>(x.itens||[]).map(i=>esc(i.qtd)+'× '+esc(i.sku||'sem SKU')).join(', ')||esc(x.unidades||0)+' un.';
 return '<h3>PEDIDOS SEM CHECKOUT ('+ls.length+')</h3>'+ls.slice(0,MAX_SEM_CHECKOUT).map(x=>'<div class="ped'+(x.atrasado?' atr':'')+'"><b>'+esc(x.canal)+'</b><span>'+esc(x.conta)+'</span><b>'+venda(x)+'</b>'+skus(x)+'<span>'+esc(x.situacao||'')+(x.bling_situacao?' · Bling: '+esc(x.bling_situacao):'')+'</span><span>'+(x.herdado?'dia anterior · ':'')+'meta '+(x.meta?esc(x.meta.slice(11,16)):'—')+'</span></div>').join('')+
  (ls.length>MAX_SEM_CHECKOUT?'<div class="ped"><span>e mais '+(ls.length-MAX_SEM_CHECKOUT)+' pedido(s)</span></div>':'');
}
let timer=null;
async function carregar(){
 const sim=$('modo').value==='sim';$('boxhora').style.display=sim?'':'none';
 if(!sim&&!DIA_FIXO&&$('dia').dataset.auto!=='0')$('dia').value=hojeIso();      // real: sempre o dia de hoje (muda sozinho à meia-noite)
 const q=new URLSearchParams({dia:$('dia').value});if(sim){q.set('simular','1');q.set('hora',hhmm(+$('hora').value))}
 let d;try{const r=await fetch('/expedicao/dia?'+q);if(!r.ok)throw new Error(r.status===404?'Painel fechado nesta máquina (modulos_locais.json).':'Erro '+r.status);d=await r.json()}
 catch(e){$('mods').innerHTML='<div class="vazio">'+esc(e.message)+'</div>';return}
 $('titulo').textContent='Expedição — '+d.dia.split('-').reverse().join('/');
 if(d.carregando){$('mods').innerHTML='<div class="vazio">Carregando os pedidos reais…<br><small>a primeira carga depois de ligar o servidor leva cerca de 1 minuto</small></div>'+(d.erro?'<div class="vazio" style="color:#fca5a5">'+esc(d.erro)+'</div>':'');setTimeout(carregar,5000);return}
 let atual='';
 if(d.modo==='real'&&d.atualizado_em){const velho=d.idade_seg>180;atual='<span style="font-size:15px;margin-left:12px;color:'+(velho?'#fca5a5':'#94a3b8')+'">dados de '+d.atualizado_em.slice(11,16)+(velho?' · DESATUALIZADO':'')+(d.atualizando?' · atualizando…':'')+'</span>'}
 $('simtag').innerHTML=(d.modo==='simulacao'?'<span class="sim">SIMULAÇÃO</span>':'')+atual;
 SIM_FIXO=d.modo==='simulacao'?Date.parse(d.agora):null;DESVIO=Date.parse(d.agora)-Date.now();$('horatxt').textContent=hhmm(+$('hora').value);
 $('alertas').innerHTML=d.alertas.map(a=>'<div class="al '+a.nivel+'">'+(a.nivel==='critico'?'⚠ ':'• ')+esc(a.texto)+'</div>').join('');
 $('semchk').innerHTML=semCheckout(d.sem_checkout||[]);
 $('mods').innerHTML=(d.modulos||[]).map(cartao).join('');
 const g=d.geral;$('fulltit').textContent='Montagem do Full no dia'+(g.full_envios?' · '+g.full_envios+' envio(s), '+g.full_unidades_restantes+' de '+g.full_unidades+' un. a montar':'');
 $('full').innerHTML=d.full.length?d.full.map(f=>{const cls=f.atrasado?'atraso':(f.minutos_ate_prazo!=null&&f.minutos_ate_prazo<=120&&!f.concluido?'alerta':'ok');
  return '<div class="env"><div><div class="tt"><span class="canal '+esc(f.canal)+'">'+esc(NOMES[f.canal]||f.canal)+'</span>#'+esc(f.numero)+'</div><div class="sub">'+esc(f.conta||'')+' · '+f.unidades_total+' un. · pronto até '+esc((f.prazo||'').slice(11,16)||'pendente')+'</div>'+
  '<div class="barra f"><div style="width:'+f.percentual+'%"></div></div><div class="sub">'+f.unidades_prontas+' de '+f.unidades_total+' prontas ('+f.percentual+'%)</div></div>'+
  '<div class="sub" style="font-size:18px;color:#cbd5e1">'+f.produtos.map(x=>esc(x.sku)+'<br>Estoque: <b>'+esc(x.estoquista||'—')+'</b> · Embalagem: <b>'+esc(x.embalador||'—')+'</b><div style="margin-top:6px">'+['T','E','OK'].map(t=>'<span class="chip '+(x.etapas[t]?'on':'')+'">'+t+'</span>').join('')+'</div>').join('<hr>')+'</div>'+
  '<div class="meta '+cls+'" style="text-align:right">'+(f.status==='fila'?'na fila<br><span style="font-size:18px">aguardando início</span>':f.concluido?'✔ pronto':(f.atrasado?'atrasado '+fmtMin(-f.minutos_ate_prazo):'faltam '+fmtMin(f.minutos_ate_prazo)))+'</div></div>'}).join(''):'<div class="vazio" style="padding-left:0">Nenhum envio Full neste dia</div>';
 tick();
}
$('modo').onchange=()=>{$('dia').dataset.auto='1';if(!DIA_FIXO)$('dia').value=$('modo').value==='real'?hojeIso():iso(amanha);carregar()};
$('dia').onchange=()=>{$('dia').dataset.auto='0';carregar()};$('hora').oninput=carregar;
$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Reproduzir o dia';return}
 $('play').textContent='⏸ Pausar';if(+$('hora').value>=1195)$('hora').value=300;
 timer=setInterval(()=>{const v=+$('hora').value+5;if(v>1200){clearInterval(timer);timer=null;$('play').textContent='▶ Reproduzir o dia';return}$('hora').value=v;carregar()},1200)};
carregar();if(TV||$('modo').value==='real')setInterval(carregar,30000);
</script></body></html>
