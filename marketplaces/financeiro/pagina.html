<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Financeiro — em implantação</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font:15px/1.4 system-ui,Segoe UI,Arial}
header{background:#374151;color:#fff;padding:14px 22px}h1{margin:0;font-size:18px}
main{padding:20px 22px;max-width:900px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 20px;margin-bottom:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;background:#e5e7eb;color:#374151}
.tag.pronto{background:#dcfce7;color:#166534}.tag.em_desenvolvimento{background:#fef3c7;color:#854d0e}
li{margin:6px 0}.mut{color:#6b7280}
</style></head><body>
<header><h1>Financeiro · em implantação</h1></header>
<main>
<div class="card"><b>Fases do módulo</b><ul id="fases"></ul></div>
<div class="card"><b>Capturas diárias já guardadas</b><div id="cap" class="mut">carregando…</div></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOMES={pedido_historico:'Pedidos Mercado Livre',reclamacao_historico:'Reclamações Mercado Livre',amazon_pedido_historico:'Pedidos Amazon'};
fetch('/financeiro/estado').then(r=>r.json()).then(d=>{
 document.getElementById('fases').innerHTML=d.fases.map(f=>'<li><span class="tag '+esc(f.estado)+'">'+esc(f.estado.replace('_',' '))+'</span> '+esc(f.fase)+'</li>').join('');
 const k=Object.keys(d.capturas);
 document.getElementById('cap').innerHTML=d.banco_existe&&k.length?k.map(t=>esc(NOMES[t]||t)+': <b>'+esc(d.capturas[t]??'—')+'</b> registros').join('<br>'):'Nenhuma captura nesta máquina (as capturas rodam no servidor).';
});
</script></body></html>
